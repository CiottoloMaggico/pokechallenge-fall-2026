name: ci

on:
  push:
  pull_request:

# a newer push makes the running checks of the same branch useless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # the tests read only tests/fixtures, so the LFS data files are not fetched
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        # pyproject.toml points pyright at the virtual environment .env
        run: |
          python -m venv .env
          .env/bin/pip install -r requirements.txt
      - name: Ruff
        run: |
          .env/bin/ruff check .
          .env/bin/ruff format --check .
      - name: Pyright
        run: .env/bin/pyright
      - name: Pytest
        # one line per test (--verbosity, since addopts has -q) and the slowest ones, so a slow or
        # hanging test is named in the log; pyproject.toml stops any single test after 300 s
        timeout-minutes: 35
        run: |
          set -o pipefail
          .env/bin/pytest --verbosity=1 --durations=15 2>&1 | tee pytest.log
      - name: Pytest log tail
        # the test that was running and the end of the log without pytest's own frames, as
        # annotations of the run summary (readable without opening the log; 4 KB each)
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          lines = open("pytest.log").read().splitlines()
          tests = [line for line in lines if "::" in line and line.startswith("tests/")]
          kept, skip = [], False
          for line in lines:
              if skip:
                  skip = False
                  continue
              if re.search(r"site-packages/(_pytest|pluggy)/", line):
                  skip = True
                  continue
              kept.append(line)

          def annotate(title, text):
              text = text[-3800:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={title}::{text}")

          annotate("last tests", "\n".join(tests[-3:]))
          annotate("end of the pytest log", "\n".join(kept))
          EOF
