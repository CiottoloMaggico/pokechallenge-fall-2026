[project]
name = "pokechallenge"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff", "pyright", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/golden.py may change only in _export (CLAUDE.md), so it is not reformatted or retyped;
# the sketches of the markdown guides are not Python files to format.
extend-exclude = [".env", "results", "runs", "input", "tools/golden.py", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
strict = [
    "domain",
    "interfaces.py",
    "stats_tables.py",
]
include = ["."]
exclude = [".env", "results", "runs", "input", "**/__pycache__", "tools/golden.py"]
venvPath = "."
venv = ".env"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
