[project]
name = "pokechallenge"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff", "pyright", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".env", "results", "runs", "input"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["statistics"]  # our statistics.py, not the standard library's

[tool.pyright]
typeCheckingMode = "basic"
strict = [
    "domain",
    "interfaces.py",
    "statistics.py",
]
include = ["."]
exclude = [".env", "results", "runs", "input", "**/__pycache__"]
venvPath = "."
venv = ".env"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
